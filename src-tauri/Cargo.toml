[package]
name = "netsleuth"
version = "0.4.0"
description = "NetSleuth — Network Traffic Investigator. Tauri app that monitors router traffic per device and site."
authors = ["fivelidz"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix is necessary to make the lib name unique vs the bin name.
name = "netsleuth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "netsleuth"
path = "src/main.rs"

[[bin]]
name = "netsleuth-mcp"
path = "src/bin/mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- NetSleuth core ---
rusqlite = { version = "0.40", features = ["bundled"] } # SQLite storage
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] } # OSINT lookups (Wigle/OpenCellID)

# Packet/DNS parsing is implemented in-tree (stable wire formats, zero
# dependency surface): classic-pcap reader, Ethernet/VLAN/IP/TCP/UDP,
# DNS (with compression), TLS ClientHello SNI, DHCP/BOOTP options.

[profile.release]
lto = true
codegen-units = 1
strip = true
